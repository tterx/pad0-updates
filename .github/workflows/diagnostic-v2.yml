name: Verify independent diagnostic v2 on Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/diagnostics/window-state-v2
      - name: Verify Windows PowerShell 5 with actual native window
        shell: powershell
        run: ./tools/diagnostics/window-state-v2/verify.ps1
      - name: Verify PowerShell 7 with actual native window
        shell: pwsh
        run: ./tools/diagnostics/window-state-v2/verify.ps1
