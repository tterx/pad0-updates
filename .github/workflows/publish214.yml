name: Publish checked v1.0.6 release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish214.yml
      - .github/scripts/publish214.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v1-0-6-214
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked ZIP and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish214.py
