name: Publish checked v1.0.33 release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v1-0-33-241
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked ZIP and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish241.py
