name: Publish checked v1.0.90 release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish298.yml
      - .github/scripts/publish298.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v1-0-50-298
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked ZIP and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish298.py
