name: Publish checked v1.0.93 release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v1-0-93-candidate-301
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            releases/v1.0.93
      - name: Verify exact checked bytes and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish301.py
